<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | OneSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="bg-white border-bottom shadow-sm sticky-top">
    <nav class="container-fluid px-3 px-md-4 py-2" aria-label="Main navigation">
      <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-2">
        <a href="workspaces.html" class="text-decoration-none d-flex align-items-center">
          <i class="bi bi-grid-3x3-gap-fill text-primary fs-4 me-2"></i>
          <span class="fw-bold fs-5 text-dark">OneSpace</span>
        </a>
        <ul class="nav nav-tabs nav-fill flex-row flex-wrap gap-1" role="tablist">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html?workspace_id=WS_ID" data-nav="dashboard">
              <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="tasks.html?workspace_id=WS_ID" aria-current="page" data-nav="tasks">
              <i class="bi bi-kanban me-1"></i> Tasks
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="notes.html?workspace_id=WS_ID" data-nav="notes">
              <i class="bi bi-journal-text me-1"></i> Notes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="resources.html?workspace_id=WS_ID" data-nav="resources">
              <i class="bi bi-link-45deg me-1"></i> Resources
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="files.html?workspace_id=WS_ID" data-nav="files">
              <i class="bi bi-file-earmark me-1"></i> Files
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html?workspace_id=WS_ID" data-nav="search">
              <i class="bi bi-search me-1"></i> Search
            </a>
          </li>
        </ul>
        <button class="btn btn-outline-secondary btn-sm ms-auto" id="logoutBtn" type="button">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </nav>
  </header>

  <main class="container-fluid py-4" id="app">
    <div class="d-flex flex-column flex-md-row align-items-start justify-content-between mb-4 gap-3">
      <div>
        <nav aria-label="Breadcrumb" class="mb-2">
          <ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item"><a href="workspaces.html">Workspaces</a></li>
            <li class="breadcrumb-item"><a href="dashboard.html?workspace_id=WS_ID" id="dashboardLink">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Tasks</li>
          </ol>
        </nav>
        <h1 class="h3 mb-1" id="workspaceTitle">Tasks</h1>
        <p class="text-muted mb-0" id="workspaceDescription">Workspace description</p>
      </div>
      <div class="d-flex gap-2">
        <a href="dashboard.html?workspace_id=WS_ID" class="btn btn-outline-secondary" id="backDashboard">
          <i class="bi bi-arrow-left me-1"></i> Back
        </a>
        <button class="btn btn-primary" id="addTaskBtn" type="button" data-bs-toggle="modal" data-bs-target="#taskModal">
          <i class="bi bi-plus-lg me-1"></i> Add Task
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <label for="statusFilter" class="form-label visually-hidden">Status</label>
            <select class="form-select" id="statusFilter" aria-label="Filter by status">
              <option value="">All Statuses</option>
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>
          <div class="col-12 col-md-4">
            <label for="priorityFilter" class="form-label visually-hidden">Priority</label>
            <select class="form-select" id="priorityFilter" aria-label="Filter by priority">
              <option value="">All Priorities</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="col-12 col-md-4">
            <div class="input-group">
              <input type="text" class="form-control" id="searchInput" placeholder="Search tasks…" aria-label="Search tasks">
              <button class="btn btn-outline-secondary" type="button" id="clearSearch" aria-label="Clear search">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tasks Table -->
    <div class="card" id="tasksCard">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tasksTable">
          <thead class="table-light">
            <tr>
              <th scope="col">Title</th>
              <th scope="col">Status</th>
              <th scope="col">Priority</th>
              <th scope="col">Due Date</th>
              <th scope="col" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="tasksBody">
            <!-- Injected -->
          </tbody>
        </table>
      </div>
      <div id="tasksEmpty" class="empty-state d-none p-5">
        <i class="bi bi-kanban"></i>
        <h4>No tasks found</h4>
        <p class="mb-3">Create your first task to get started.</p>
        <button class="btn btn-primary" id="emptyAddTaskBtn" type="button" data-bs-toggle="modal" data-bs-target="#taskModal">
          <i class="bi bi-plus-lg me-1"></i> Add Task
        </button>
      </div>
    </div>
  </main>

  <!-- Task Modal -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalLabel">Add Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="taskForm" class="needs-validation" novalidate>
          <input type="hidden" id="taskId" name="id">
          <div class="modal-body">
            <div class="mb-3">
              <label for="taskTitle" class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="taskTitle" name="title" placeholder="Task title" required maxlength="200">
              <div class="invalid-feedback">Title is required.</div>
            </div>
            <div class="mb-3">
              <label for="taskDescription" class="form-label">Description</label>
              <textarea class="form-control" id="taskDescription" name="description" rows="3" placeholder="Details…" maxlength="2000"></textarea>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="taskStatus" class="form-label">Status</label>
                <select class="form-select" id="taskStatus" name="status" required>
                  <option value="To Do">To Do</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Done">Done</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="taskPriority" class="form-label">Priority</label>
                <select class="form-select" id="taskPriority" name="priority" required>
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="taskDueDate" class="form-label">Due Date</label>
                <input type="date" class="form-control" id="taskDueDate" name="due_date">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="taskSubmit">
              <span class="btn-text">Save</span>
              <span class="btn-loading d-none"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Saving…</span>
            </button>
          </div>
        </form>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
