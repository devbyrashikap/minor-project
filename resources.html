<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources | OneSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="bg-white border-bottom shadow-sm sticky-top">
    <nav class="container-fluid px-3 px-md-4 py-2" aria-label="Main navigation">
      <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-2">
        <a href="workspaces.html" class="text-decoration-none d-flex align-items-center">
          <i class="bi bi-grid-3x3-gap-fill text-primary fs-4 me-2"></i>
          <span class="fw-bold fs-5 text-dark">OneSpace</span>
        </a>
        <ul class="nav nav-tabs nav-fill flex-row flex-wrap gap-1" role="tablist">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html?workspace_id=WS_ID" data-nav="dashboard">
              <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tasks.html?workspace_id=WS_ID" data-nav="tasks">
              <i class="bi bi-kanban me-1"></i> Tasks
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="notes.html?workspace_id=WS_ID" data-nav="notes">
              <i class="bi bi-journal-text me-1"></i> Notes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="resources.html?workspace_id=WS_ID" aria-current="page" data-nav="resources">
              <i class="bi bi-link-45deg me-1"></i> Resources
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="files.html?workspace_id=WS_ID" data-nav="files">
              <i class="bi bi-file-earmark me-1"></i> Files
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html?workspace_id=WS_ID" data-nav="search">
              <i class="bi bi-search me-1"></i> Search
            </a>
          </li>
        </ul>
        <button class="btn btn-outline-secondary btn-sm ms-auto" id="logoutBtn" type="button">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </nav>
  </header>

  <main class="container-fluid py-4" id="app">
    <div class="d-flex flex-column flex-md-row align-items-start justify-content-between mb-4 gap-3">
      <div>
        <nav aria-label="Breadcrumb" class="mb-2">
          <ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item"><a href="workspaces.html">Workspaces</a></li>
            <li class="breadcrumb-item"><a href="dashboard.html?workspace_id=WS_ID" id="dashboardLink">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Resources</li>
          </ol>
        </nav>
        <h1 class="h3 mb-1" id="workspaceTitle">Resources</h1>
        <p class="text-muted mb-0" id="workspaceDescription">Workspace description</p>
      </div>
      <div class="d-flex gap-2">
        <a href="dashboard.html?workspace_id=WS_ID" class="btn btn-outline-secondary" id="backDashboard">
          <i class="bi bi-arrow-left me-1"></i> Back
        </a>
        <button class="btn btn-primary" id="addResourceBtn" type="button" data-bs-toggle="modal" data-bs-target="#resourceModal">
          <i class="bi bi-plus-lg me-1"></i> Add Resource
        </button>
      </div>
    </div>

    <div class="card" id="resourcesCard">
      <div class="card-body p-0" id="resourcesContainer">
        <!-- Resource cards injected here -->
      </div>
      <div id="resourcesEmpty" class="empty-state d-none">
        <i class="bi bi-link-45deg"></i>
        <h4>No resources yet</h4>
        <p class="mb-3">Add links to useful references.</p>
        <button class="btn btn-primary" id="emptyAddResourceBtn" type="button" data-bs-toggle="modal" data-bs-target="#resourceModal">
          <i class="bi bi-plus-lg me-1"></i> Add Resource
        </button>
      </div>
    </div>
  </main>

  <!-- Resource Modal -->
  <div class="modal fade" id="resourceModal" tabindex="-1" aria-labelledby="resourceModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resourceModalLabel">Add Resource</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="resourceForm" class="needs-validation" novalidate>
          <input type="hidden" id="resourceId" name="id">
          <div class="modal-body">
            <div class="mb-3">
              <label for="resourceTitle" class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="resourceTitle" name="title" placeholder="Resource title" required maxlength="200">
              <div class="invalid-feedback">Title is required.</div>
            </div>
            <div class="mb-3">
              <label for="resourceUrl" class="form-label">URL <span class="text-danger">*</span></label>
              <input type="url" class="form-control" id="resourceUrl" name="url" placeholder="https://example.com" required maxlength="500">
              <div class="invalid-feedback">Please enter a valid URL.</div>
            </div>
            <div class="mb-3">
              <label for="resourceDescription" class="form-label">Description</label>
              <textarea class="form-control" id="resourceDescription" name="description" rows="3" placeholder="Brief description…" maxlength="1000"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="resourceSubmit">
              <span class="btn-text">Save</span>
              <span class="btn-loading d-none"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Saving…</span>
            </button>
          </div>
        </form>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/resources.js"></script>
</body>
</html>
