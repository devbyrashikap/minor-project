<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspaces | OneSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="bg-white border-bottom shadow-sm sticky-top">
    <div class="container-fluid px-3 px-md-4 py-2 d-flex align-items-center justify-content-between">
      <a href="workspaces.html" class="text-decoration-none d-flex align-items-center">
        <i class="bi bi-grid-3x3-gap-fill text-primary fs-3 me-2"></i>
        <span class="fw-bold fs-4 text-dark">OneSpace</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm" id="logoutBtn" type="button">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="container-fluid py-4">
    <div class="d-flex flex-column flex-md-row align-items-start justify-content-between mb-4 gap-3">
      <div>
        <h1 class="h3 mb-1">Workspaces</h1>
        <p class="text-muted mb-0">Manage your projects and contexts</p>
      </div>
      <button class="btn btn-primary" id="createWorkspaceBtn" type="button" data-bs-toggle="modal" data-bs-target="#createWorkspaceModal">
        <i class="bi bi-plus-lg me-1"></i> New Workspace
      </button>
    </div>

    <div id="workspaceList" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
      <!-- Workspace cards will be injected here -->
    </div>

    <div id="emptyState" class="empty-state d-none">
      <i class="bi bi-folder2-open"></i>
      <h4>No workspaces yet</h4>
      <p class="mb-3">Create your first workspace to start organizing your work.</p>
      <button class="btn btn-primary" id="emptyCreateBtn" type="button" data-bs-toggle="modal" data-bs-target="#createWorkspaceModal">
        <i class="bi bi-plus-lg me-1"></i> Create Workspace
      </button>
    </div>
  </main>

  <!-- Create Workspace Modal -->
  <div class="modal fade" id="createWorkspaceModal" tabindex="-1" aria-labelledby="createWorkspaceModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createWorkspaceModalLabel">Create Workspace</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="createWorkspaceForm" class="needs-validation" novalidate>
          <div class="modal-body">
            <div class="mb-3">
              <label for="workspaceName" class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="workspaceName" name="name" placeholder="e.g., Product Design System" required maxlength="100" autocomplete="off">
              <div class="invalid-feedback">Workspace name is required.</div>
            </div>
            <div class="mb-3">
              <label for="workspaceDescription" class="form-label">Description</label>
              <textarea class="form-control" id="workspaceDescription" name="description" rows="3" placeholder="Brief description of this workspace..." maxlength="500"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="createWorkspaceSubmit">
              <span class="btn-text">Create</span>
              <span class="btn-loading d-none"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Creating…</span>
            </button>
          </div>
        </form>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/workspaces.js"></script>
</body>
</html>
